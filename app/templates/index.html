<!DOCTYPE html> 
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Barbearia do Jotta</title>
</head>
<body>

    <h1> Bem-vindo à Barbearia!</h1>
    
    <p>Agende seu horário conosco e tenha um corte de cabelo incrível!</p>
   
    <label>Nome do cliente:  </label> <input type="text" id="nome_cliente">
    
    <label> Nome do Barbeiro: </label> <input type="text" id="nome_barbeiro">

    <label> Data e Hora do Agendamento: </label> <input type ="datetime-local" id ="data_hora">

    <button onclick="criarAgendamento()"> AGENDAR </button>
   
     <script>
        async function criarAgendamento () {
            const nome_cliente = document.getElementById("nome_cliente").value   //"No documento, pega o elemento com id 'nome_cliente' e pega o valor (.value) que está dentro dele"
            const nome_barbeiro = document.getElementById("nome_barbeiro").value
            const data_hora = document.getElementById("data_hora").value
            
            /////////////////////////////////////////////////
            
            const resposta=await fetch ("/agendamento" ,{
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({nome_cliente, nome_barbeiro, data_hora})
        })
            const dados = await resposta.json ()
            alert (dados.mensagem)
    }
    </script>
</body>
</html>
